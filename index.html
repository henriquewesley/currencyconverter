<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <script src="./scripts.js" defer></script>
  <title>Conversor de moedas - DevWH</title>
</head>

<body>

  <img class="logo" src="./assets/logo.png" alt="logo do conversor de moedas" />

  <main>

    <label>
      Converter <b>de</b>:
      <select class="currency-select-up">
        <option>Selecione a moeda para converter</option>
        <option value="BRL">R$ Real (BRL)</option>
        <option value="USD">US$ Dólar (USD)</option>
        <option value="EUR">€ Euro (EUR)</option>
        <option value="GBP">£ Libra esterlina (GBP)</option>
        <option value="BTC">₿ Bitcoin (BTC)</option>
      </select>
    </label>

    <label>
      Converter <b>para</b>:
      <select class="currency-select">
        <option>Selecione uma moeda de conversão</option>
        <option value="BRL">R$ Real (BRL)</option>
        <option value="USD">US$ Dólar (USD)</option>
        <option value="EUR">€ Euro (EUR)</option>
        <option value="GBP">£ Libra esterlina (GBP)</option>
        <option value="BTC">₿ Bitcoin (BTC)</option>
      </select>
    </label>
    <p class="label">Digite o valor a converter:</p>

    <Input class="input-currency" placeholder="Exemplo: 123.45"></Input>

    <button class="convert-button">Converter</button>

    <section>
      <div class="currency-box">
        <img class="currency-img-up" />
        <p class="currency" id="name-currency"></p>
        <p class="currency-value-to-be-converted"></p>
      </div>
      <img class="converter" src="./assets/money.png" alt="seta de conversão">
      <div class="currency-box">
        <img class="currency-img" />
        <p class="currency" id="currency-name"></p>
        <p class="converted-currency-value"></p>
      </div>
    </section>
  </main>
</body>

</html>
